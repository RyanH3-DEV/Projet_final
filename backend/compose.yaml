services:
  database:
    image: mysql:8.0
    # Je m'assure que l'authentification fonctionne bien sous Windows
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: livre
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql

  php:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    depends_on:
      - database

volumes:
  db-data:
