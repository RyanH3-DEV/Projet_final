security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            # J'ai retiré json_login ici pour éviter le conflit avec le contrôleur

    access_control:
        # J'autorise tout le monde à tenter de se connecter
        - { path: ^/api/login_check, roles: PUBLIC_ACCESS }
